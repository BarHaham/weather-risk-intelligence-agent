<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Risk Agent</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b2430; --muted:#5d6b7a; --line:#dde3ea;
          --accent:#1f5fbf; --user:#e8f0fc; --land:#e1e6ec; --land-edge:#ffffff;
          --Low:#2e7d4f; --Moderate:#b7791f; --High:#c2410c; --Severe:#9b1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --panel:#1b2129; --ink:#e6ebf1; --muted:#9aa7b5; --line:#2c3440;
            --accent:#6ea8ff; --user:#1e2b40; --land:#2a323d; --land-edge:#1b2129;
            --Low:#4fb07a; --Moderate:#d69e2e; --High:#ec6a3a; --Severe:#e05252; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  /* Desktop: chat left, map + ranking right. Mobile: one column, chat first (document order). */
  main { display:grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap:16px;
         padding:16px; max-width:1280px; margin:0 auto; align-items:start; }
  .side { display:flex; flex-direction:column; gap:16px; min-width:0; }
  @media (max-width: 899px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; min-width:0; }
  #log { height: calc(100vh - 230px); min-height:320px; overflow-y:auto; padding:16px; }
  @media (max-width: 899px) { #log { height: 60vh; min-height:280px; } }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:10px; max-width: 95%; overflow-wrap:anywhere; }
  .user { background:var(--user); margin-left:auto; width:fit-content; }
  .bot { border:1px solid var(--line); }
  .bot .ans p { margin:6px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .meta { font-size:13px; color:var(--muted); }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .breakdown .scroll { overflow-x:auto; }
  table { border-collapse:collapse; font-size:13px; margin:6px 0; }
  td, th { border-bottom:1px solid var(--line); padding:3px 8px; text-align:left; }
  tr.headline td { font-weight:600; }
  .follow button, .suggest button { margin:4px 6px 0 0; font-size:13px; padding:4px 10px; border-radius:999px;
                   border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; text-align:left; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
                     background:var(--bg); color:var(--ink); font-size:15px; }
  button.send { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .side .panel { padding:14px; } .side h2 { font-size:14px; margin:0 0 8px; }
  .rank-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .tier { font-size:12px; font-weight:600; }
  .err { color:var(--High); }
  .examples button { display:block; width:100%; text-align:left; margin:4px 0; padding:6px 8px; font-size:13px;
                     border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); cursor:pointer; }
  /* map */
  #map { width:100%; height:auto; display:block; }
  #map .state { fill:var(--land); stroke:var(--land-edge); stroke-width:1; }
  #map .hub { cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; }
  #map .hub circle { stroke:var(--panel); stroke-width:4; }
  #map .hub text { font-size:28px; font-weight:600; fill:var(--ink); paint-order:stroke;
                   stroke:var(--panel); stroke-width:7px; stroke-linejoin:round; }
  #map .hub:hover circle, #map .hub:focus-visible circle { stroke:var(--accent); stroke-width:7; }
  #map .hub.selected circle { stroke:var(--ink); stroke-width:7; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); margin:6px 0 0; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .hubcard { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .hubcard form { padding:8px 0 0; border:0; }
  .attrib { font-size:11px; margin:10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Weather Risk Intelligence Agent</h1>
  <p>Ask about weather-disruption exposure of our distribution hubs. Scores come from a deterministic model; the AI explains them.</p>
</header>
<main>
  <section class="panel" id="chat" aria-label="Chat">
    <div id="log"></div>
    <form id="f">
      <input id="q" type="text" autocomplete="off" aria-label="Your question"
             placeholder="e.g. Which hubs in the Midwest are most exposed to winter disruption?">
      <button class="send" id="send">Ask</button>
    </form>
  </section>
  <div class="side">
    <section class="panel" id="map-panel" aria-labelledby="map-title">
      <h2 id="map-title">Hub map</h2>
      <svg id="map" viewBox="0 0 975 610" role="group" aria-label="Map of company hubs; select a hub to ask about it">
        <g id="states"></g><g id="markers"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="hubcard" id="hubcard" aria-live="polite">
        <p class="meta">Select a hub on the map to see it and ask about it.</p>
      </div>
      <p class="attrib meta" id="attrib"></p>
    </section>
    <section class="panel">
      <h2>Overall risk ranking</h2>
      <div id="ranking" class="meta">Loading…</div>
      <h2 style="margin-top:16px">Try</h2>
      <div class="examples" id="examples"></div>
      <p class="meta" style="margin-top:16px"><a href="#" id="newchat">Start a new conversation</a></p>
    </section>
  </div>
</main>
<script>
const EXAMPLES = [
  "Which hubs in the Midwest are most exposed to winter disruption?",
  "Compare Miami and Houston in terms of hurricane and flood exposure.",
  "What percentage of days in Denver last year had snowfall?",
  "Why is the Dallas hub's weather disruption risk high?",
];
const TIERS = ["Low", "Moderate", "High", "Severe"];
const SVG = "http://www.w3.org/2000/svg";
let sessionId = null;
try { sessionId = localStorage.getItem("wr_session"); } catch (e) {}
const log = document.getElementById("log");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const narrow = () => window.matchMedia("(max-width: 899px)").matches;
const score = v => Number(v).toFixed(1);  // 41 -> "41.0"

function md(text) {  // tiny, safe Markdown subset: paragraphs, bullets, bold, italics, code
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
                            .replace(/`(.+?)`/g, "<code>$1</code>");
  const out = []; let list = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}

function add(html, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}

// Main result first: the answer text, then everything numeric in ONE collapsed "Breakdown".
function breakdownHtml(figures) {
  if (!figures.length) return "";
  const isHead = f => f.role === "headline";          // figures without a role count as detail
  const rows = [...figures.filter(isHead), ...figures.filter(f => !isHead(f))];
  const nDetail = figures.length - figures.filter(isHead).length;
  const summary = nDetail ? `Breakdown (${figures.length} figures)` : `Figures (${figures.length})`;
  return `<details class="breakdown"><summary>${summary}</summary><div class="scroll"><table>
    <tr><th>Figure</th><th>Value</th><th>Source</th></tr>${rows.map(f =>
      `<tr class="${isHead(f) ? "headline" : "detail"}"><td>${esc(f.label)}</td><td>${esc(f.value)} ${esc(f.unit)}</td><td>${esc(f.source_tool)}</td></tr>`).join("")}
  </table></div></details>`;
}

function renderAnswer(r) {
  const a = r.answer;
  const list = xs => xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class='meta'>none</p>";
  const chips = a.hubs.map(h => `<span class="chip">${esc(h.hub_id)} · ${esc(h.hazard)} ${esc(h.score)}</span>`).join("");
  const tools = r.tool_calls.map(t => `<li><code>${esc(t.tool)}</code> ${esc(JSON.stringify(t.input))}${t.is_error ? " <span class='err'>(error)</span>" : ""}</li>`).join("");
  const follow = a.follow_up_suggestions.map(s => `<button type="button">${esc(s)}</button>`).join("");
  const el = add(`
    <div class="ans">${md(a.answer)}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    ${breakdownHtml(a.figures)}
    <div class="meta">Confidence: <b>${esc(a.confidence)}</b>${a.in_scope ? "" : " · out of scope"}
      · Answered by <b>${esc(r.models?.answered_by || "?")}</b>${r.models?.fallback
        ? ` <span class="err">(fallback from ${esc(r.models.fallback.from)}: ${esc(r.models.fallback.reason)})</span>` : ""}</div>
    <details><summary>Reasoning, sources &amp; assumptions</summary>
      <b>Reasoning steps</b>${list(a.reasoning_steps)}
      <b>Data sources</b>${list(a.data_sources)}
      <b>Assumptions</b>${list(a.assumptions)}
      <b>Tool calls</b><ul>${tools || "<li class='meta'>none</li>"}</ul>
    </details>
    <div class="follow">${follow}</div>`, "bot");
  el.querySelectorAll(".follow button").forEach(b => b.onclick = () => ask(b.textContent));
}

async function ask(text) {
  if (!text.trim()) return;
  add(esc(text), "user");
  const btn = document.getElementById("send"); btn.disabled = true;
  const pending = add("<span class='meta'>Thinking and running tools…</span>", "bot");
  try {
    const res = await fetch("/chat", { method:"POST", headers:{"Content-Type":"application/json"},
                                       body: JSON.stringify({ message:text, session_id:sessionId }) });
    const body = await res.json();
    pending.remove();
    if (!res.ok) { add(`<span class="err">${esc(body.detail || res.statusText)}</span>`, "bot"); return; }
    sessionId = body.session_id;
    try { localStorage.setItem("wr_session", sessionId); } catch (e) {}
    renderAnswer(body);
  } catch (e) { pending.remove(); add(`<span class="err">${esc(e)}</span>`, "bot"); }
  finally { btn.disabled = false; }
}

// ---------- hub map ----------
function hubName(h) { return `${h.city}, ${h.state}`; }

function askAbout(h, text) {
  text = text.trim();
  if (!text) return;
  // Make the hub explicit unless the question already names it; the chat shows what is sent.
  const msg = text.toLowerCase().includes(h.city.toLowerCase()) ? text : `About the ${hubName(h)} hub: ${text}`;
  if (narrow()) document.getElementById("chat").scrollIntoView({ behavior: "smooth", block: "start" });
  ask(msg);
}

function selectHub(h) {
  document.querySelectorAll("#markers .hub").forEach(g => {
    const on = g.dataset.id === h.id;
    g.classList.toggle("selected", on); g.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const card = document.getElementById("hubcard");
  const suggestions = [`What drives the ${hubName(h)} hub's risk score?`,
                       `How does ${h.city} rank against the other hubs?`];
  card.innerHTML = `
    <div><b id="hub-name">${esc(hubName(h))}</b> <span class="meta">${esc(h.region)} · ${esc(h.county)} County</span></div>
    <div class="meta">Overall risk <b>${score(h.overall_score)}</b>
      <span class="tier" style="color:var(--${esc(h.tier)})">${esc(h.tier)}</span> · rank ${esc(h.rank)} of ${esc(window.HUBS.length)}</div>
    <div class="suggest">${suggestions.map(s => `<button type="button">${esc(s)}</button>`).join("")}</div>
    <form id="hubask"><input type="text" autocomplete="off" aria-label="${esc(`Ask about ${hubName(h)}`)}"
      placeholder="${esc(`Ask about ${hubName(h)}…`)}"><button class="send">Ask</button></form>`;
  card.querySelectorAll(".suggest button").forEach(b => b.onclick = () => askAbout(h, b.textContent));
  card.querySelector("#hubask").onsubmit = e => {
    e.preventDefault(); const inp = e.target.querySelector("input"); askAbout(h, inp.value); inp.value = ""; };
}

// Keep city labels readable: a label that would overlap an earlier label or another marker
// moves to the left of its marker, then below it, whichever fits first.
function placeLabels() {
  const hubs = [...document.querySelectorAll("#markers .hub")];
  const at = g => g.transform.baseVal.consolidate().matrix;
  const circles = hubs.map(g => { const m = at(g); return { x: m.e - 15, y: m.f - 15, width: 30, height: 30, g }; });
  const overlap = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height;
  const placed = [];
  const spots = [{ x: 19, y: 10, anchor: "start" }, { x: -19, y: 10, anchor: "end" }, { x: 0, y: 44, anchor: "middle" },
                 { x: 0, y: -24, anchor: "middle" }];
  for (const g of hubs) {
    const t = g.querySelector("text"), m = at(g);
    for (const s of spots) {
      t.setAttribute("x", s.x); t.setAttribute("y", s.y); t.setAttribute("text-anchor", s.anchor);
      const b = t.getBBox(), box = { x: m.e + b.x, y: m.f + b.y, width: b.width, height: b.height };
      const clash = placed.some(p => overlap(p, box)) || circles.some(c => c.g !== g && overlap(c, box));
      if (!clash) break;  // otherwise try the next spot (the last one is kept if none fits)
    }
    const b = t.getBBox(); placed.push({ x: m.e + b.x, y: m.f + b.y, width: b.width, height: b.height });
  }
}

function drawMap(atlas, hubsOnMap) {
  window.HUBS = hubsOnMap;
  const states = document.getElementById("states");
  for (const s of atlas.states) {
    const p = document.createElementNS(SVG, "path");
    p.setAttribute("d", s.d); p.setAttribute("class", "state");
    const t = document.createElementNS(SVG, "title"); t.textContent = s.name; p.appendChild(t);
    states.appendChild(p);
  }
  const markers = document.getElementById("markers");
  for (const h of hubsOnMap) {
    const g = document.createElementNS(SVG, "g");
    g.setAttribute("class", "hub"); g.dataset.id = h.id;
    g.setAttribute("transform", `translate(${h.x} ${h.y})`);
    g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-pressed", "false");
    g.setAttribute("aria-label", `${hubName(h)}, overall ${score(h.overall_score)}, ${h.tier}`);
    const c = document.createElementNS(SVG, "circle");
    c.setAttribute("r", "13"); c.setAttribute("fill", `var(--${h.tier})`);
    const label = document.createElementNS(SVG, "text");
    label.setAttribute("x", "19"); label.setAttribute("y", "10"); label.textContent = h.city;
    const tip = document.createElementNS(SVG, "title"); tip.textContent = `${hubName(h)}: overall ${score(h.overall_score)} (${h.tier})`;
    g.append(c, label, tip);
    g.addEventListener("click", () => selectHub(h));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectHub(h); } });
    markers.appendChild(g);
  }
  placeLabels();
  document.getElementById("legend").innerHTML = "<span>Overall risk tier:</span>" +
    TIERS.map(t => `<span><i style="background:var(--${t})"></i>${t}</span>`).join("");
  document.getElementById("attrib").textContent = atlas.attribution;
}

Promise.all([fetch("/static/us-states.json").then(r => r.json()), fetch("/map/hubs").then(r => r.json())])
  .then(([atlas, hubsOnMap]) => drawMap(atlas, hubsOnMap))
  .catch(() => { document.getElementById("hubcard").innerHTML = "<p class='meta'>Map unavailable.</p>"; });

// ---------- chat controls and ranking ----------
document.getElementById("f").onsubmit = e => { e.preventDefault(); const q = document.getElementById("q"); ask(q.value); q.value = ""; };
document.getElementById("newchat").onclick = e => { e.preventDefault(); sessionId = null;
  try { localStorage.removeItem("wr_session"); } catch (err) {} log.innerHTML = ""; };
const ex = document.getElementById("examples");
EXAMPLES.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => ask(t); ex.appendChild(b); });

fetch("/rankings").then(r => r.json()).then(rows => {
  document.getElementById("ranking").innerHTML = rows.map(r =>
    `<div class="rank-row"><span>${r.rank}. ${esc(r.city)}</span><span>${score(r.score)} <span class="tier" style="color:var(--${r.tier})">${esc(r.tier)}</span></span></div>`).join("")
    + `<p class="meta">Confidence: ${esc(rows[0]?.confidence || "")} (see caveats in answers)</p>`;
}).catch(() => { document.getElementById("ranking").textContent = "Could not load ranking."; });
</script>
</body>
</html>

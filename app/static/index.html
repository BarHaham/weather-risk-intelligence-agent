<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Risk Agent</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b2430; --muted:#5d6b7a; --line:#dde3ea;
          --accent:#1f5fbf; --user:#e8f0fc; --Low:#2e7d4f; --Moderate:#b7791f; --High:#c2410c; --Severe:#9b1c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --panel:#1b2129; --ink:#e6ebf1; --muted:#9aa7b5; --line:#2c3440;
            --accent:#6ea8ff; --user:#1e2b40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 300px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  #log { height: calc(100vh - 230px); min-height:320px; overflow-y:auto; padding:16px; }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:10px; max-width: 95%; }
  .user { background:var(--user); margin-left:auto; width:fit-content; }
  .bot { border:1px solid var(--line); }
  .bot .ans p { margin:6px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .meta { font-size:13px; color:var(--muted); }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--muted); font-size:13px; }
  table { border-collapse:collapse; font-size:13px; margin:6px 0; }
  td, th { border-bottom:1px solid var(--line); padding:3px 8px; text-align:left; }
  .follow button { margin:4px 6px 0 0; font-size:13px; padding:4px 10px; border-radius:999px;
                   border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
                     background:var(--bg); color:var(--ink); font-size:15px; }
  button.send { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  aside { padding:14px; } aside h2 { font-size:14px; margin:0 0 8px; }
  .rank-row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .tier { font-size:12px; font-weight:600; }
  .err { color:#c2410c; }
  .examples button { display:block; width:100%; text-align:left; margin:4px 0; padding:6px 8px; font-size:13px;
                     border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Weather Risk Intelligence Agent</h1>
  <p>Ask about weather-disruption exposure of our distribution hubs. Scores come from a deterministic model; the AI explains them.</p>
</header>
<main>
  <section class="panel">
    <div id="log"></div>
    <form id="f">
      <input id="q" type="text" autocomplete="off" placeholder="e.g. Which hubs in the Midwest are most exposed to winter disruption?">
      <button class="send" id="send">Ask</button>
    </form>
  </section>
  <aside class="panel">
    <h2>Overall risk ranking</h2>
    <div id="ranking" class="meta">Loading…</div>
    <h2 style="margin-top:16px">Try</h2>
    <div class="examples" id="examples"></div>
    <p class="meta" style="margin-top:16px"><a href="#" id="newchat">Start a new conversation</a></p>
  </aside>
</main>
<script>
const EXAMPLES = [
  "Which hubs in the Midwest are most exposed to winter disruption?",
  "Compare Miami and Houston in terms of hurricane and flood exposure.",
  "What percentage of days in Denver last year had snowfall?",
  "Why is the Dallas hub's weather disruption risk high?",
];
let sessionId = null;
try { sessionId = localStorage.getItem("wr_session"); } catch (e) {}
const log = document.getElementById("log");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function md(text) {  // tiny, safe Markdown subset: paragraphs, bullets, bold, italics, code
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
                            .replace(/`(.+?)`/g, "<code>$1</code>");
  const out = []; let list = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}

function add(html, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}

function renderAnswer(r) {
  const a = r.answer;
  const list = xs => xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class='meta'>none</p>";
  const chips = a.hubs.map(h => `<span class="chip">${esc(h.hub_id)} · ${esc(h.hazard)} ${h.score}</span>`).join("");
  const figs = a.figures.length ? `<table><tr><th>Figure</th><th>Value</th><th>Source</th></tr>${
      a.figures.map(f => `<tr><td>${esc(f.label)}</td><td>${f.value} ${esc(f.unit)}</td><td>${esc(f.source_tool)}</td></tr>`).join("")}</table>` : "";
  const tools = r.tool_calls.map(t => `<li><code>${esc(t.tool)}</code> ${esc(JSON.stringify(t.input))}${t.is_error ? " <span class='err'>(error)</span>" : ""}</li>`).join("");
  const follow = a.follow_up_suggestions.map(s => `<button type="button">${esc(s)}</button>`).join("");
  const el = add(`
    <div class="ans">${md(a.answer)}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    ${figs}
    <div class="meta">Confidence: <b>${esc(a.confidence)}</b>${a.in_scope ? "" : " · out of scope"}
      · Answered by <b>${esc(r.models?.answered_by || "?")}</b>${r.models?.fallback
        ? ` <span class="err">(fallback from ${esc(r.models.fallback.from)}: ${esc(r.models.fallback.reason)})</span>` : ""}</div>
    <details><summary>Reasoning, sources &amp; assumptions</summary>
      <b>Reasoning steps</b>${list(a.reasoning_steps)}
      <b>Data sources</b>${list(a.data_sources)}
      <b>Assumptions</b>${list(a.assumptions)}
      <b>Tool calls</b><ul>${tools || "<li class='meta'>none</li>"}</ul>
    </details>
    <div class="follow">${follow}</div>`, "bot");
  el.querySelectorAll(".follow button").forEach(b => b.onclick = () => ask(b.textContent));
}

async function ask(text) {
  if (!text.trim()) return;
  add(esc(text), "user");
  const btn = document.getElementById("send"); btn.disabled = true;
  const pending = add("<span class='meta'>Thinking and running tools…</span>", "bot");
  try {
    const res = await fetch("/chat", { method:"POST", headers:{"Content-Type":"application/json"},
                                       body: JSON.stringify({ message:text, session_id:sessionId }) });
    const body = await res.json();
    pending.remove();
    if (!res.ok) { add(`<span class="err">${esc(body.detail || res.statusText)}</span>`, "bot"); return; }
    sessionId = body.session_id;
    try { localStorage.setItem("wr_session", sessionId); } catch (e) {}
    renderAnswer(body);
  } catch (e) { pending.remove(); add(`<span class="err">${esc(e)}</span>`, "bot"); }
  finally { btn.disabled = false; }
}

document.getElementById("f").onsubmit = e => { e.preventDefault(); const q = document.getElementById("q"); ask(q.value); q.value = ""; };
document.getElementById("newchat").onclick = e => { e.preventDefault(); sessionId = null;
  try { localStorage.removeItem("wr_session"); } catch (err) {} log.innerHTML = ""; };
const ex = document.getElementById("examples");
EXAMPLES.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => ask(t); ex.appendChild(b); });

fetch("/rankings").then(r => r.json()).then(rows => {
  document.getElementById("ranking").innerHTML = rows.map(r =>
    `<div class="rank-row"><span>${r.rank}. ${esc(r.city)}</span><span>${r.score} <span class="tier" style="color:var(--${r.tier})">${esc(r.tier)}</span></span></div>`).join("")
    + `<p class="meta">Confidence: ${esc(rows[0]?.confidence || "")} (see caveats in answers)</p>`;
}).catch(() => { document.getElementById("ranking").textContent = "Could not load ranking."; });
</script>
</body>
</html>
